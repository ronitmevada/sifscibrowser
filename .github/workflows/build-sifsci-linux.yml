name: Build Sifsci Browser (Android)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-sifsci-linux.yml'
      - 'chrome/app/theme/chromium/BRANDING'
      - 'chrome/test/chromedriver/constants/BRANDING'
      - 'docs/sifsci_branding.md'

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Sync DEPS dependencies
        run: |
          cd "${GITHUB_WORKSPACE}/.."
          ln -sfn "${GITHUB_WORKSPACE}" src
          python3 -c 'from pathlib import Path; Path(".gclient").write_text("solutions = [\n  {\n    \"name\": \"src\",\n    \"url\": \"https://github.com/${GITHUB_REPOSITORY}.git\",\n    \"managed\": False,\n    \"custom_deps\": {},\n  },\n]\ntarget_os = [\"android\"]\n")'
          gclient sync --no-history --with_branch_heads --with_tags

      - name: Generate Android build files
        run: |
          gn gen out/SifsciAndroid --args='target_os="android" target_cpu="arm64" is_debug=false is_component_build=false symbol_level=0'

      - name: Build Android APK
        run: |
          autoninja -C out/SifsciAndroid chrome_public_apk

      - name: Collect Android APK artifact
        run: |
          mkdir -p dist/android
          cp out/SifsciAndroid/apks/ChromePublic.apk dist/android/SifsciBrowser.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sifsci-android-apk
          path: dist/android/SifsciBrowser.apk
          if-no-files-found: error
